name: upgrade-deps

on:
  workflow_dispatch:
    inputs:
      upgrade-all-sites:
        description: '升级全部站点（勾选后忽略下面的站点选择）'
        type: boolean
        default: true

      dry-run:
        description: '试运行：不提交、不推送、不提 PR'
        type: boolean
        default: false

      vue-next:
        description: 'tdesign-vue-next'
        type: boolean
        default: false
      vue:
        description: 'tdesign-vue'
        type: boolean
        default: false
      react:
        description: 'tdesign-react'
        type: boolean
        default: false
      mobile-vue:
        description: 'tdesign-mobile-vue'
        type: boolean
        default: false
      mobile-react:
        description: 'tdesign-mobile-react'
        type: boolean
        default: false
      miniprogram:
        description: 'tdesign-miniprogram'
        type: boolean
        default: false
      flutter:
        description: 'tdesign-flutter（站点子目录 tdesign-site）'
        type: boolean
        default: false
      starter-docs:
        description: 'tdesign-starter-docs'
        type: boolean
        default: false

      site-components:
        description: '@tdesign/site-components'
        type: boolean
        default: true
      theme-generator:
        description: '@tdesign/theme-generator'
        type: boolean
        default: true

jobs:
  resolve-deps:
    if: github.repository == 'Tencent/tdesign'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.deps.outputs.deps }}
    steps:
      - id: deps
        env:
          SITE_COMPONENTS: ${{ inputs['site-components'] }}
          THEME_GENERATOR: ${{ inputs['theme-generator'] }}
        run: |
          DEPS=""
          for name in SITE_COMPONENTS THEME_GENERATOR; do
            if [ "${!name}" = "true" ]; then
              case "$name" in
                SITE_COMPONENTS) pkg='@tdesign/site-components' ;;
                THEME_GENERATOR) pkg='@tdesign/theme-generator' ;;
              esac
              DEPS="${DEPS:+$DEPS }$pkg"
            fi
          done
          if [ -z "$DEPS" ]; then
            echo "::error::至少需要勾选一个依赖包"
            exit 1
          fi
          echo "deps=$DEPS" >> "$GITHUB_OUTPUT"

  upgrade-deps:
    needs: resolve-deps
    if: github.repository == 'Tencent/tdesign'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: tdesign-vue-next
            package-manager: pnpm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs['vue-next']) && 'yes' || 'no' }}
          - repo: tdesign-vue
            package-manager: npm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs.vue) && 'yes' || 'no' }}
          - repo: tdesign-react
            package-manager: pnpm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs.react) && 'yes' || 'no' }}
          - repo: tdesign-mobile-vue
            package-manager: npm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs['mobile-vue']) && 'yes' || 'no' }}
          - repo: tdesign-mobile-react
            package-manager: npm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs['mobile-react']) && 'yes' || 'no' }}
          - repo: tdesign-miniprogram
            package-manager: pnpm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs.miniprogram) && 'yes' || 'no' }}
          # 站点位于 tdesign-site 子目录，需要 target-dir
          - repo: tdesign-flutter
            package-manager: pnpm
            target-dir: tdesign-site
            selected: ${{ (inputs['upgrade-all-sites'] || inputs.flutter) && 'yes' || 'no' }}
          # 仓库属于 TDesignOteam，无 lock 文件，默认分支为 develop
          - repo: tdesign-starter-docs
            owner: TDesignOteam
            package-manager: npm
            selected: ${{ (inputs['upgrade-all-sites'] || inputs['starter-docs']) && 'yes' || 'no' }}
    steps:
      - name: Skip unselected site
        if: matrix.selected != 'yes'
        run: echo "skip ${{ matrix.repo }}"

      - uses: TDesignOteam/workflows/actions/upgrade-deps@main
        if: matrix.selected == 'yes'
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          owner: ${{ matrix.owner || 'Tencent' }}
          repo: ${{ matrix.repo }}
          package-manager: ${{ matrix.package-manager }}
          target-dir: ${{ matrix.target-dir }}
          dry-run: ${{ inputs['dry-run'] }}
          deps: ${{ needs.resolve-deps.outputs.deps }}
          title: 'chore: upgrade tdesign site deps'
