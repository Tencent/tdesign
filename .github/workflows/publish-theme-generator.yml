name: publish-theme-generator

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - packages/theme-generator/package.json

  workflow_dispatch:

jobs:
  publish-theme-generator:
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'Tencent/tdesign' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: pnpm install

      - run: pnpm -F @tdesign/theme-generator run build

      # 为了兼容 oidc 特指定 node 版本最小为 24
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish Package
        run: pnpm -F @tdesign/theme-generator publish --no-git-checks

  upgrade-deps:
    needs: publish-theme-generator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: tdesign-vue-next
            package-manager: pnpm
          - repo: tdesign-vue
            package-manager: npm
          - repo: tdesign-react
            package-manager: pnpm
          - repo: tdesign-mobile-vue
            package-manager: npm
          - repo: tdesign-mobile-react
            package-manager: npm
          - repo: tdesign-miniprogram
            package-manager: pnpm
    steps:
      # 等待 npm registry 同步新包，避免 upgrade-deps 检测不到刚发布的版本
      - name: Sleep for npm registry sync
        run: sleep 10

      - uses: TDesignOteam/workflows/actions/upgrade-deps@main
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          owner: Tencent
          repo: ${{ matrix.repo }}
          package-manager: ${{ matrix.package-manager }}
          deps: '@tdesign/theme-generator'
