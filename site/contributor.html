<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDesign Contributors</title>
    <style>
      #list {
        display: flex;
        flex-wrap: wrap;
      }
      #list > a {
        position: relative;
        display: block;
        padding: 4px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
      #list > a::after {
        content: attr(data-github-id);
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        z-index: 1;
        padding: 4px 8px;
        color: #fff;
        font-size: 12px;
        line-height: 20px;
        white-space: nowrap;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 4px;
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%);
        transition: opacity 0.2s;
      }
      #list > a:hover,
      #list > a:focus-visible {
        z-index: 2;
      }
      #list > a:hover::after,
      #list > a:focus-visible::after {
        opacity: 1;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 100%;
      }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <script type="module" src="/src/contributor.ts"></script>
  </body>
</html>
